<!doctype html><html lang="vi"><meta charset="utf-8"><style>
body{font:14px system-ui;width:310px;padding:14px;color:#202124}label{display:block;margin:9px 0 4px}input{box-sizing:border-box;width:100%;padding:8px}button{margin-top:12px;padding:9px 12px;width:100%}#status{margin-top:10px;white-space:pre-wrap}.version{color:#5f6368;font-size:12px}.capabilities{border:1px solid #dadce0;border-radius:6px;margin-top:12px;padding:8px}.capabilities label{margin:5px 0}.capabilities input{width:auto}
</style><h3>Flow Image Worker <span class="version" id="version"></span></h3>
<label>API URL</label><input id="apiUrl">
<label>API key</label><input id="apiKey" type="password">
<label>Worker ID</label><input id="workerId">
<label>Flow project URL</label><input id="flowProjectUrl" placeholder="https://labs.google/fx/vi/tools/flow/project/..."><button id="useCurrentProject" type="button">Dùng project ở tab hiện tại</button>
<label><input id="enabled" type="checkbox" style="width:auto"> Bật worker</label>
<div class="capabilities"><strong>Model/API được phép dùng</strong>
<label><input type="checkbox" data-capability="chat:gemini:3.5-flash-lite"> Gemini 3.5 Flash Lite</label>
<label><input type="checkbox" data-capability="chat:gemini:3.1-pro"> Gemini 3.1 Pro</label>
<label><input type="checkbox" data-capability="chat:chatgpt:default"> ChatGPT chat</label>
<label><input type="checkbox" data-capability="image:flow:default"> Flow image</label>
<label><input type="checkbox" data-capability="image:chatgpt:default"> ChatGPT image</label>
<label><input type="checkbox" data-capability="video:flow:veo-3.1-lite"> Flow Veo 3.1 Lite</label>
</div>
<button id="save">Lưu và kiểm tra ngay</button><button id="update" type="button">Kiểm tra và cập nhật extension</button><div id="status"></div><script src="popup.js"></script></html>
