services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      FLOW_HOST: 0.0.0.0
      FLOW_PORT: 8787
      FLOW_WORKER: extension
      FLOW_API_KEY: ${FLOW_API_KEY:?Set FLOW_API_KEY in Coolify}
      FLOW_MAX_QUEUED: ${FLOW_MAX_QUEUED:-100}
      FLOW_MAX_RETRIES: ${FLOW_MAX_RETRIES:-2}
      FLOW_MAX_PROMPTS: ${FLOW_MAX_PROMPTS:-100}
      FLOW_MAX_IMAGES_PER_JOB: ${FLOW_MAX_IMAGES_PER_JOB:-100}
      FLOW_IMAGE_BATCH_SIZE: ${FLOW_IMAGE_BATCH_SIZE:-10}
      FLOW_IMAGE_MAX_RETRIES: ${FLOW_IMAGE_MAX_RETRIES:-0}
      FLOW_CHAT_INLINE_WAIT_MS: ${FLOW_CHAT_INLINE_WAIT_MS:-20000}
      FLOW_IMAGE_INLINE_WAIT_MS: ${FLOW_IMAGE_INLINE_WAIT_MS:-2000}
      FLOW_VIDEO_INLINE_WAIT_MS: ${FLOW_VIDEO_INLINE_WAIT_MS:-2000}
      FLOW_PROJECT_URL: ${FLOW_PROJECT_URL:?Set FLOW_PROJECT_URL in Coolify}
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:?Set TURSO_DATABASE_URL in Coolify}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:?Set TURSO_AUTH_TOKEN in Coolify}
      S3_ENDPOINT: ${S3_ENDPOINT:?Set S3_ENDPOINT in Coolify}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-flow-images}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in Coolify}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in Coolify}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:?Set S3_PUBLIC_URL in Coolify}
      S3_MANAGE_BUCKET: ${S3_MANAGE_BUCKET:-false}
    expose:
      - "8787"
    ports:
      - "8787:8787"

  chrome:
    build:
      context: .
      dockerfile: Dockerfile.chrome
    restart: unless-stopped
    shm_size: 2gb
    depends_on:
      backend:
        condition: service_healthy
    environment:
      FLOW_API_KEY: ${FLOW_API_KEY:?Set FLOW_API_KEY in Coolify}
      FLOW_EXTENSION_API_URL: http://backend:8787
      FLOW_EXTENSION_WORKER_ID: ${FLOW_EXTENSION_WORKER_ID:-coolify-chrome}
      FLOW_EXTENSION_ENABLED: ${FLOW_EXTENSION_ENABLED:-true}
      FLOW_EXTENSION_FORCE_CONFIG: ${FLOW_EXTENSION_FORCE_CONFIG:-true}
      FLOW_START_URL: ${FLOW_START_URL:-https://gemini.google.com/app}
      CHROME_SCREEN: ${CHROME_SCREEN:-1920x1080x24}
      NOVNC_PASSWORD: ${NOVNC_PASSWORD:?Set NOVNC_PASSWORD in Coolify}
    volumes:
      - chrome-profile:/data/chromium
    expose:
      - "6080"
    ports:
      - "6080:6080"

volumes:
  chrome-profile:
